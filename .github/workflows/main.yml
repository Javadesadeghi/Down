name: ⬇️ Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🔗 Links (one per line)"
        required: true
        type: string
      mode:
        description: "📦 mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - zip
      password:
        description: "🔒 zip password (optional)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip curl

      - name: Download files
        env:
          URLS: ${{ inputs.urls }}
          MODE: ${{ inputs.mode }}
          ZIP_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          mkdir -p downloads tmp

          download() {
            url="$1"
            name="$(basename "$url" | sed 's/[?#].*//')"
            [ -n "$name" ] || name="downloaded_file"

            echo "Downloading $url"
            aria2c -x 4 -s 4 -d tmp -o "$name" "$url" || curl -L --fail -o "tmp/$name" "$url"
          }

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            download "$url"
          done <<< "$URLS"

          if [ "$MODE" = "zip" ]; then
            for file in tmp/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -j -P "$ZIP_PASSWORD" "downloads/$name.zip" "$file"
              else
                zip -j "downloads/$name.zip" "$file"
              fi
            done
          else
            cp -r tmp/* downloads/ 2>/dev/null || true
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloads
          git commit -m "download files" || echo "no changes"
          git push

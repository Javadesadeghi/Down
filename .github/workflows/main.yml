name: ⬇️ Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🔗 Links (one per line)"
        required: true
        type: string

      mode:
        description: "📦 mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - zip

      password:
        description: "🔒 zip password (optional)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip curl

      - name: Download files
        env:
          URLS: ${{ inputs.urls }}
          MODE: ${{ inputs.mode }}
          ZIP_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail

          mkdir -p downloads tmp

          download() {
            local url="$1"
            local name
            name="$(basename "$url" | sed 's/[?#].*//')"

            if [ -z "$name" ] || [ "$name" = "/" ] || [ "$name" = "." ]; then
              name="downloaded_file_$(date +%s%N)"
            fi

            echo "Downloading $url"
            aria2c -x 4 -s 4 -d tmp -o "$name" "$url" || curl -L --fail -o "tmp/$name" "$url"
          }

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            download "$url"
          done <<< "$URLS"

          if [ "$MODE" = "zip" ]; then
            for file in tmp/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"

              if [ -n "$ZIP_PASSWORD" ]; then
                zip -j -P "$ZIP_PASSWORD" "downloads/$name.zip" "$file"
              else
                zip -j "downloads/$name.zip" "$file"
              fi
            done
          else
            cp -r tmp/* downloads/ 2>/dev/null || true
          fi

          ls -lah downloads

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads/
          if-no-files-found: error
          retention-days: 7

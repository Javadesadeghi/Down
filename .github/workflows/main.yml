name: ⬇️ 01 - Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 لینک های دانلود (با فاصله جدا کنید)'
        required: true
        type: string

      mode:
        description: '📦 حالت دانلود'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip

      password:
        description: '🔒 رمز عبور برای فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  save-file:
    name: "📥 Download Files"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip curl bc

      - name: Download files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          mkdir -p downloads tmp_downloads

          download_file() {
            URL="$1"
            NAME=$(basename "$URL" | sed 's/%20/ /g' | sed 's/[?#].*//')

            echo "Downloading: $URL"

            aria2c --dir=tmp_downloads --out="$NAME" "$URL" \
              || curl -L -o "tmp_downloads/$NAME" "$URL"
          }

          for URL in $URLS; do
            download_file "$URL"
          done

          if [ "$MODE" = "zip" ]; then
            mkdir -p downloads/archive

            for FILE in tmp_downloads/*; do
              [ -f "$FILE" ] || continue

              NAME=$(basename "$FILE")

              if [ -n "$ZIP_PASSWORD" ]; then
                zip -P "$ZIP_PASSWORD" "downloads/archive/$NAME.zip" "$FILE"
              else
                zip "downloads/archive/$NAME.zip" "$FILE"
              fi
            done
          else
            cp -r tmp_downloads/* downloads/
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add downloads

          git commit -m "download files" || echo "No changes"

          git push

name: ⬇️ Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🔗 Links (separated by space)"
        required: true
        type: string

      mode:
        description: "📦 mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - zip

      password:
        description: "🔒 zip password (optional)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip curl

      - name: Download files
        run: |
          mkdir -p downloads tmp

          URLS="${{ github.event.inputs.urls }}"
          MODE="${{ github.event.inputs.mode }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          download() {
            url="$1"
            name=$(basename "$url" | sed 's/[?#].*//')

            echo "Downloading $url"

            aria2c -x 4 -s 4 -d tmp -o "$name" "$url" \
              || curl -L -o "tmp/$name" "$url"
          }

          for url in $URLS; do
            download "$url"
          done

          if [ "$MODE" = "zip" ]; then
            mkdir -p downloads

            for file in tmp/*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")

              if [ -n "$ZIP_PASSWORD" ]; then
                zip -P "$ZIP_PASSWORD" "downloads/$name.zip" "$file"
              else
                zip "downloads/$name.zip" "$file"
              fi
            done
          else
            cp -r tmp/* downloads/
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add downloads

          git commit -m "download files" || echo "no changes"

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
